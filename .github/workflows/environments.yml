name: Environment harness
on:
  push:
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker info
      - run: cargo test -p pa-environments --features docker-integration -- --test-threads=1
        env:
          OPENAI_API_KEY: environment-test-sentinel
          ANTHROPIC_API_KEY: environment-test-sentinel
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: make check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: make deny
